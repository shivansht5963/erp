{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div>
    <h1>{{ title }}</h1>
    <form method="post" id="notification_form">
        {% csrf_token %}
        
        <div>
            {{ form.as_p }}
        </div>

        <div class="submit-row">
            <input type="submit" value="Send Notification" class="default" name="_save">
        </div>
    </form>
</div>
{% endblock %}
